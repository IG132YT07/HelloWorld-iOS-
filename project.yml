name: HelloWorld
options:
  bundleIdPrefix: com.myhello.app
  deploymentTarget:
    iOS: "15.0"
targets:
  HelloWorld:
    type: application
    platform: iOS
    sources:
      - HelloWorld
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myhello.app.HelloWorld
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
